services:
  database:
    container_name: "postgress-dev"
    image: "postgres:16.0-alpine3.18"
    env_file:
      - ../.env.development
    ports:
      - "5432:5432"
  mailcatcher:
    container_name: "mailcatcher-dev"
    image: "sj26/mailcatcher:v0.11.0"
    ports:
      - "1080:1080"
      - "1025:1025"